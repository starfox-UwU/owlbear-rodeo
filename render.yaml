services:
  - type: web
    name: Owlbear Rodeo Legacy
    runtime: static
    # Render's default Yarn is v1; corepack pins Yarn 4 from packageManager.
    buildCommand: corepack enable && yarn install --immutable && yarn build
    staticPublishPath: ./build
    pullRequestPreviewsEnabled: false
    branch: main
    buildFilter:
      paths:
      - src/**/*.js
      - src/**/*.ts
      - src/**/*.tsx
      - package.json
      - yarn.lock
      - vite.config.ts
      - index.html
      ignoredPaths:
      - src/**/*.test.js
      - src/**/*.test.ts
      - src/**/*.test.tsx
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
      - path: /*
        name: X-Robots-Tag
        value: noindex
    envVars:
        - key: VITE_BROKER_URL
          fromService:
            type: web
            name: "Owlbear Rodeo Backend"
            envVarKey: RENDER_EXTERNAL_URL
        - key: VITE_MAINTENANCE
          value: false
        - key: NODE_VERSION
          value: "24"
  # A Docker web service
  - type: web
    name: Owlbear Rodeo Backend
    runtime: docker
    region: oregon # optional (defaults to oregon) check other regions here: https://render.com/docs/regions
    plan: free
    branch: main
    rootDir: ./backend
    dockerfilePath: ./Dockerfile
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: ORIGIN_WHITELIST
        fromService:
          type: web
          name: "Owlbear Rodeo Legacy"
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: PORT
        value: 9000
      - key: NODE_VERSION
        value: "24"
