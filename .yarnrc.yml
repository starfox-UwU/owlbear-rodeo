# Yarn 4 (Berry) configuration.
# node-modules linker keeps compatibility with Vite, Vitest, Docker and every
# tool in this repo that expects a physical node_modules folder.
nodeLinker: node-modules

# Keep a single shared cache across projects to avoid re-downloading packages.
enableGlobalCache: true

enableTelemetry: false

# Yarn 4 refuses to fetch code from arbitrary git remotes unless they are
# explicitly allow-listed. `ammo.js` (Bullet physics for the Babylon dice
# engine) has no usable npm release, so it is pinned to a GitHub commit.
approvedGitRepositories:
  - "https://github.com/kripken/ammo.js.git"
