name: Build and Deploy Pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack (Yarn 4)
        run: corepack enable
      # Setup-node can only locate Yarn's cache folder once Yarn 4 is active,
      # so the caching step is intentionally a second call.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Typecheck
        run: yarn typecheck
      - name: Test
        run: yarn test
      - name: Build (load .env)
        shell: bash
        run: |
          if [ -f .env ]; then
            set -a
            . ./.env
            set +a
          fi
          yarn build
      - name: Deploy build to pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: pages
